# Reference run: 18 in diameter x 60 in tall, A06 polygons and triangles.
# All lengths in inches. Values marked (open) are defaults Jerry has not confirmed.

[input]
kind = "revolve"                      # "revolve" (v1) | "surface" (later, L1)
profile = "examples/cylinder_18x60_profile.step"

[stone]
thickness = 0.375

[pattern]
pattern = "voronoi_triangles"
allowed_sides = [6]                   # any subset of 4..9
target_size = 6.5                     # legacy setting; triangles use min_triangle_edge
size_variation = "tight"              # "tight" = +-15 %, "wide" = +-40 %   (open)
randomness = 0.0                      # 0 = regular, 1 = organic
seed = 42
count_step = 2

[ends]
top = "open"
bottom = "open"
top_rim = "level"                     # "level" = keep partial pieces, "whole" = uneven rim
bottom_rim = "level"

[limits]
min_edge = 1.0                        # (open)
max_edge = 6.0                        # (open)
min_corner_angle_deg = 30.0
bevel_cap_deg = 60.0
depth = 0.3
min_triangle_edge = 1.5
max_polygon_edge = 3.0
relief_base = "auto"
max_back_gap = 0.5
max_corner_angle_deg = 230.0
min_bounding_square = 4.0             # rim partials only
allow_waists = false

[blanks]
size = 12.0
usable = 11.5                         # (open)
nest_gap = 0.25

[output]
dir = "runs"
preview = true                        # write preview.glb
