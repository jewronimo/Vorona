[package]
name = "vstone-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "vstone_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "vstone-core"
path = "src/main.rs"

[[example]]
name = "c3_diagnostics"
required-features = ["c4-experiments"]

[[example]]
name = "c4_ablation"
required-features = ["c4-experiments"]

[[example]]
name = "c4_conformal_vase"
required-features = ["c4-experiments"]

[[example]]
name = "c4_depth_profile"
required-features = ["c4-experiments"]

[[example]]
name = "c4_depthsweep"
required-features = ["c4-experiments"]

[[example]]
name = "c4_matrix"
required-features = ["c4-experiments"]

[[example]]
name = "c4_native_export"
required-features = ["c4-experiments"]

[[example]]
name = "c4_production_matrix"
required-features = ["c4-experiments"]

[[example]]
name = "c4_reference"
required-features = ["c4-experiments"]

[[example]]
name = "c4_report"
required-features = ["c4-experiments"]

[[example]]
name = "c4_sizeband"
required-features = ["c4-experiments"]

[[example]]
name = "c4_spatial"
required-features = ["c4-experiments"]

[[example]]
name = "c4_vaserows"
required-features = ["c4-experiments"]

[features]
# Archived unguarded diagnostics are opt-in, never linked by production builds.
c4-experiments = []
python = ["dep:pyo3", "dep:pyo3-build-config"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
pyo3 = { version = "0.27", optional = true, features = ["extension-module", "abi3-py311"] }

rand = "0.8"
rand_chacha = "0.3"
spade = "2"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }

[dev-dependencies]
jsonschema = "0.33"

[build-dependencies]
pyo3-build-config = { version = "0.27", optional = true }

# Geometry repair is CPU-bound; unoptimized test builds obscure convergence.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
