[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "vstone"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["build123d", "numpy", "reportlab", "trimesh"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
vstone = "vstone.cli:main"

[tool.maturin]
manifest-path = "core/Cargo.toml"
features = ["python"]
python-source = "py"
module-name = "vstone.vstone_core"

[tool.pytest.ini_options]
testpaths = ["tests/py"]
pythonpath = ["py"]
